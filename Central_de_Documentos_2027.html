function migrateSnapshot(s){if(s.version!==1||!Array.isArray(s.alteracoes)||!Array.isArray(s.removidos)||!Array.isArray(s.adicionados)||!isObj(s.etapas))throw Error('Registro anterior inválido.');const out={version:2,programs:{P:fresh(),S:fresh()},prefs:defaultPrefs()};out.prefs.quota=({AC:'AC',LI:'LI_EP',LB:'LB_EP'})[s.mode]||'LI_EP';for(const a of s.adicionados){const p=a.id?.[0];if(!out.programs[p])throw Error('Programa inválido.');out.programs[p].custom.push({id:a.id,name:a.name,g:a.g,cat:10,kind:a.kind==='O'?'O':'C',mode:p==='P'?'P':a.mode,time:a.phase==='D'?'E':'N',detail:'Importado do painel anterior.',link:'',shared:false,urgent:false});out.programs[p].items[a.id]={...emptyItem(),status:a.status==='R'?'A':a.status,note:String(a.note||''),copy:!!a.copy,applicable:a.status==='V',updated:''};}for(const a of s.alteracoes){const p=a.id?.[0];if(!out.programs[p])throw Error('Programa inválido.');out.programs[p].items[a.id]={...emptyItem(),status:a.status==='R'?'A':a.status,note:(a.status==='R'?'Prioridade urgente (registro anterior). ':'')+String(a.obs||''),copy:!!a.copia,applicable:a.status==='V',name:a.nome,updated:''};}for(const id of s.removidos){if(!out.programs[id[0]])throw Error('Exclusão inválida.');out.programs[id[0]].removed.push(id);}for(const [key,v] of Object.entries(s.etapas)){if(out.programs[key[0]])out.programs[key[0]].timeline[key.slice(1)]=!!v;}return out;}
function decodeBackup(x){if(x?.version===1)x=migrateSnapshot(x);if(!isObj(x)||x.version!==2||!isObj(x.programs)||!Object.keys(x.programs).length||Object.keys(x.programs).some(p=>!['P','S'].includes(p)))throw Error('Backup incompatível.');for(const [p,s] of Object.entries(x.programs))validateProgram(s,p);if(x.prefs)validatePrefs(x.prefs);return x;}

</script><script>
const $=s=>document.querySelector(s), app=$('#app');
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label={P:'Pendente',A:'Em andamento',V:'Providenciado',U:'Aguardando atualização',X:'Não se aplica'}, kind={O:'Exigência de referência',A:'Alternativa aceita (ver condições)',C:'Condicional',P:'Complementar / preventivo',V:'A confirmar no edital'}, timing={N:'Providenciar agora',E:'Após publicação do edital',M:'Próximo à matrícula',Q:'Somente se solicitado'};
let data={P:fresh(),S:fresh()},prefs=defaultPrefs(),blocked=new Set(),route={view:'home',p:'P',g:0},query='',filter='all',opened=new Set(),closedCats=new Set();
const pn=p=>p==='P'?'ProUni':'SISU', color=p=>p==='P'?'#8b5cf6':'#3b82f6';
function notice(msg,bad=false){$('#saved').textContent=msg;$('#saved').classList.toggle('error',bad);}
function load(){for(const k of ['P','S','prefs']){try{let raw=localStorage.getItem(KEYS[k]);if(raw){let v=JSON.parse(raw);if(k==='prefs')prefs=validatePrefs(v);else data[k]=validateProgram(v,k);}}catch(err){blocked.add(k);}}if(blocked.size)notice('Falha ao ler dados locais. Exporte antes de restaurar.',true);else notice('Dados locais carregados.');}
function save(k){try{if(blocked.has(k))throw Error('Dados locais protegidos');localStorage.setItem(KEYS[k],JSON.stringify(k==='prefs'?prefs:data[k]));if(blocked.size)notice('Alguns dados locais estão protegidos. Faça backup.',true);else notice('Alterações salvas automaticamente.');return true;}catch(err){notice('Falha ao salvar. Exporte um backup agora.',true);return false;}}
function docs(p){return [...CATALOG[p],...data[p].custom].filter(d=>!data[p].removed.includes(d.id)).map(d=>{const s={...emptyItem(),...data[p].items[d.id]};return {...d,...s,name:s.name||d.name};});}
function relevant(d,p){return p==='P'||d.mode==='A'||d.mode==='E'&&prefs.quota!=='AC'||d.mode==='R'&&prefs.quota==='LB_EP';}
function applicable(d,p){return relevant(d,p)&&d.status!=='X'&&(d.kind==='O'||d.applicable||(p==='S'&&d.id==='S02'&&prefs.quota==='LB_EP'));}
function stats(ds,p){const a=ds.filter(d=>applicable(d,p)),n=a.filter(d=>d.status==='V').length;return {n,t:a.length,percent:a.length?Math.round(n*100/a.length):null};}
function bar(s){return `<div class="bar" role="progressbar" aria-label="Progresso documental" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.percent??0}"><span style="width:${s.percent??0}%"></span></div>`;}
function progress(s){return `<div class="progressline"><small>Progresso documental</small><strong>${s.percent===null?'Não se aplica':s.percent+'%'}</strong></div>${bar(s)}<div class="statline"><span>${s.n} providenciados</span><span>${s.t-s.n} pendentes</span></div>`;}
function patch(p,id,changes,redraw=true){let old=data[p].items[id]||emptyItem();data[p].items[id]={...old,...changes,updated:new Date().toISOString()};save(p);if(redraw){const focused=document.activeElement;const attr=['check','status','applicable','copy'].find(k=>focused?.dataset?.[k]===id);render();if(attr)app.querySelector(`[data-${attr}="${CSS.escape(id)}"]`)?.focus();}}
function go(view,p=route.p,g=route.g){route={view,p,g};query='';filter='all';opened.clear();closedCats.clear();render();window.scrollTo(0,0);app.querySelector('h1')?.focus();}
const folderSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg>';
const avatar=g=>`<div class="avatar" style="--avatar:${['#8b5cf6','#db6b9c','#3b82f6','#db9250','#43b9b0','#7773ca','#739781'][g]}" aria-hidden="true">${e(PROFILES[g][2])}</div>`;
const crumbs=(p,g)=>`<nav class="crumb" aria-label="Caminho"><button data-go="home">← Início</button><span>/</span>${g!==undefined?`<button data-go="program" data-p="${p}">${pn(p)} 2027</button><span>/</span><span>${e(PROFILES[g][0])}</span>`:`<span>${pn(p)} 2027</span>`}</nav>`;
const heading=(k,t,sub='')=>`<div class="eyebrow">${k}</div><h1 tabindex="-1">${t}</h1>${sub?`<p>${sub}</p>`:''}`;
function home(){return `<section class="hero">${heading('ORGANIZAÇÃO PESSOAL · 2027','Central de Documentos','SISU & ProUni 2027')}</section><div class="grid">${['P','S'].map((p,i)=>`<button class="folder" data-go="program" data-p="${p}"><div class="mark">${folderSVG}</div><div class="eyebrow">PASTA 0${i+1}</div><h2>${pn(p)} 2027</h2><small>${p==='P'?'Bolsa integral · 100%':'IFB · '+prefs.quota}</small>${progress(stats(docs(p),p))}<div class="go"><span>Acessar documentos</span><span>→</span></div></button>`).join('')}</div><div class="notice">Preparação para ADS presencial no DF. Catálogo revisado: IFB 2026, Católica 2026/1, IESB 2025 e MEC. Confira o edital de 2027 antes de entregar.</div>`;}
function program(p){return `${crumbs(p)}<div class="sectionhead"><div>${heading(pn(p)+' 2027','De quem são os documentos?','Escolha um perfil para organizar os documentos.')}</div><div class="actions">${p==='S'?'<button data-go="quota">Modalidade: '+prefs.quota+'</button>':''}<button data-go="timeline">Etapas do processo</button>${p==='P'?'<button data-go="income">Orientações de renda</button>':''}</div></div><div class="panel compact">${progress(stats(docs(p),p))}</div><div class="profilegrid">${PROFILES.map(([name,role],g)=>{const s=stats(docs(p).filter(d=>d.g===g),p);return `<button class="profile" data-go="profile" data-g="${g}">${avatar(g)}<h3>${e(name)}</h3><small>${e(role)}</small><div class="progressline"><small>${s.t?s.n+'/'+s.t+' documentos':'Sem itens aplicáveis'}</small><strong>${s.percent===null?'Não se aplica':s.percent+'%'}</strong></div>${bar(s)}</button>`;}).join('')}</div><p class="muted small">Itens condicionais entram no cálculo quando incluídos ou marcados como providenciados. Alternativas e itens preventivos podem ser incluídos manualmente; não são exigências cumulativas.</p>`;}
function docrow(d,p){const x=opened.has(d.id),id=e(d.id),other=p==='P'?'S':'P', counterpart=docs(other).find(v=>v.id===other+d.id.slice(1)),both=d.shared&&counterpart&&relevant(counterpart,other)&&counterpart.status!=='X',count=both?2:1;const source=SOURCES[d.ref]||(p==='P'?SOURCES.mec:SOURCES.ifb);return `<article class="doc ${d.status==='V'?'done':''}"><div class="docrow"><label><input type="checkbox" data-check="${id}" ${d.status==='V'?'checked':''} aria-label="Providenciado: ${e(d.name)}"><span class="docname">${e(d.name)} ${d.urgent?'<span class="urgent">· prioridade</span>':''}${!applicable(d,p)&&d.status!=='X'?'<span class="muted small"> · fora do cálculo</span>':''}</span></label><span class="copytag">${count} ${count===1?'via':'vias'}*</span><span class="status ${d.status}">${label[d.status]}</span><button class="detailsbtn" data-expand="${id}" aria-expanded="${x}" aria-label="Detalhes de ${e(d.name)}">${x?'−':'+'}</button></div>${x?`<div class="docdetail"><div class="split"><span class="pill">${kind[d.kind]}</span><small>${timing[d.time]||'Conforme edital'}</small></div><p>${e(d.detail||'Documento adicionado manualmente.')}</p><p><strong>Emissão:</strong> ${d.link&&SOURCES[d.link]?`<a target="_blank" rel="noopener noreferrer" href="${SOURCES[d.link]}">Consultar serviço oficial</a>`:'Solicitar à escola, instituição, banco, empregador, contador ou responsável, conforme o documento.'}</p><p><strong>Formato:</strong> original disponível e cópia simples ou PDF conforme convocação. ${both?'Separar 2 cópias: 1 para o ProUni e 1 para o SISU.':'Separar 1 cópia para o '+pn(p)+'.'} Quantidade preventiva; não se aplica literalmente a fotos, formulários exclusivamente digitais ou controles de conjuntos.</p><p><strong>Referência:</strong> <a href="${source}" target="_blank" rel="noopener noreferrer">${d.ref==='ucb'?'Católica — 2026/1':d.ref==='iesb'?'IESB — 2025':p==='P'?'MEC — documentação':'IFB — edital e anexos de 2026'}</a> · 25/11/2026 · confirmar edição de 2027.</p><div class="toolbar"><label>Status <select data-status="${id}">${Object.entries(label).map(([v,l])=>`<option value="${v}" ${d.status===v?'selected':''}>${l}</option>`).join('')}</select></label>${d.kind!=='O'&&!(p==='S'&&d.id==='S02'&&prefs.quota==='LB_EP')?`<label class="switch"><input type="checkbox" data-applicable="${id}" ${d.applicable?'checked':''}> Incluir no progresso</label>`:''}<label class="switch"><input type="checkbox" data-copy="${id}" ${d.copy?'checked':''}> Cópia deste programa pronta</label></div><label for="note-${id}">Observações (não inclua dados pessoais sensíveis)</label><textarea id="note-${id}" rows="2" maxlength="4000" data-note="${id}" placeholder="Ex.: solicitar na próxima semana">${e(d.note)}</textarea><div class="split"><small>Última alteração: ${d.updated?e(new Date(d.updated).toLocaleString('pt-BR')):'Nenhuma'}</small><div class="actions"><button data-edit="${id}">Editar nome</button><button class="danger" data-remove="${id}">Remover</button></div></div></div>`:''}</article>`;}
function profile(p,g){const all=docs(p).filter(d=>d.g===g&&relevant(d,p)),s=stats(all,p),shown=all.filter(d=>d.name.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR'))&&(filter==='all'||filter==='urgent'&&d.urgent&&d.status!=='V'&&d.status!=='X'||filter==='copy'&&!d.copy&&d.status!=='X'||filter==='now'&&d.time==='N'||filter==='later'&&d.time!=='N'||d.status===filter));return `${crumbs(p,g)}<div class="sectionhead"><div class="profilehead">${avatar(g)}<div>${heading(pn(p)+' 2027',e(PROFILES[g][0]),e(PROFILES[g][1]))}</div></div><button data-add="1">+ Adicionar documento</button></div><div class="panel compact">${progress(s)}</div>${!all.length?'<div class="panel empty">Documentação não necessária para esta modalidade.</div>':`<div class="toolbar"><input type="search" id="search" aria-label="Pesquisar documentos" placeholder="Pesquisar documentos..." value="${e(query)}"><select id="filter" aria-label="Filtrar documentos">${Object.entries({all:'Todos',...label,urgent:'Urgentes',copy:'Cópias pendentes',now:'Providenciar agora',later:'Após edital / matrícula'}).map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="muted small">${shown.length} itens visíveis · * vias preventivas · itens alternativos ou complementares só contam se incluídos.</p>${CATS.map((c,i)=>{const rows=shown.filter(d=>d.cat===i),cs=stats(all.filter(d=>d.cat===i),p);return rows.length?`<details class="category" data-cat="${i}" ${closedCats.has(i)?'':'open'}><summary><span>${c}</span><small>${cs.n}/${cs.t}</small></summary>${rows.map(d=>docrow(d,p)).join('')}</details>`:'';}).join('')||'<div class="empty">Nenhum documento encontrado.</div>'}`}`;}
function quota(){return `${crumbs('S')}<div class="hero">${heading('SISU · CONFIGURAÇÃO','Modalidade de concorrência','A alteração não apaga marcações anteriores.')}</div><div class="panel">${[['AC','Ampla concorrência'],['LI_EP','Escola pública, independentemente da renda'],['LB_EP','Escola pública e baixa renda']].map(([v,l])=>`<p><label class="switch"><input type="radio" name="quota" value="${v}" ${prefs.quota===v?'checked':''}> <strong>${v}</strong> — ${l}</label></p>`).join('')}</div><button class="primary" data-go="program" data-p="S">Voltar aos perfis</button>`;}
function timeline(p){return `${crumbs(p)}<div class="hero">${heading(pn(p)+' 2027','Etapas do processo','Acompanhe a seleção separadamente dos documentos.')}</div><div class="panel timeline">${TIMELINES[p].map((t,i)=>`<label><input type="checkbox" data-stage="${i}" ${data[p].timeline[i]?'checked':''}>${e(t)}</label>`).join('')}</div><a href="${SOURCES[p==='P'?'prouni':'sisu']}" target="_blank" rel="noopener noreferrer">Acessar portal oficial</a>`;}
function income(){return `${crumbs('P')}<div class="hero">${heading('PROUNI · ORIENTAÇÃO','Renda familiar','Não registre extratos, números de documentos ou informações bancárias neste aplicativo.')}</div><div class="panel"><h2>Como organizar a comprovação</h2><p>São cinco integrantes. Separe salários CLT brutos, renda informal e rendimentos pessoais da proprietária. Não trate o faturamento da serralheria como renda pessoal nem conte pagamentos internos duas vezes.</p><p>Bolsa integral: até 1,5 salário mínimo por pessoa. Bolsa parcial: até 3 salários mínimos por pessoa. SISU LB_EP: até 1 salário mínimo por pessoa. Confirme o salário mínimo e período de referência da edição de 2027.</p><p>As despesas e retiradas empresariais devem ser esclarecidas com o contador e a instituição. Não há confirmação de elegibilidade.</p></div><div class="panel"><h2>Simulação temporária (não salva)</h2><div class="formgrid"><label class="field">Renda familiar bruta mensal confirmada<input id="gross" type="number" min="0" placeholder="Valor total"></label><label class="field">Salário mínimo aplicável<input id="minimum" type="number" min="1" placeholder="Valor oficial"></label></div><p id="simulation" class="muted">Informe os valores confirmados para calcular.</p></div>`;}
function settings(){return `<nav class="crumb"><button data-go="home">← Início</button></nav><div class="hero">${heading('PREFERÊNCIAS','Configurações','Gerencie a aparência e a segurança dos seus registros locais.')}</div><div class="panel"><h2>Aparência</h2><label class="switch"><input type="checkbox" id="light" ${prefs.theme==='light'?'checked':''}> Ativar tema claro</label></div><div class="panel"><h2>Backup e recuperação</h2><p class="muted">Os dados ficam neste navegador e origem. Não há sincronização entre dispositivos. Exporte um backup antes de mudar de pasta, navegador ou limpar os dados.</p><div class="actions"><button data-export="all">Exportar backup completo</button><button data-export="P">Exportar ProUni</button><button data-export="S">Exportar SISU</button><button data-import="1">Importar backup</button><button data-restore="1">Restaurar último backup local</button></div><p class="small muted">Importa JSON v2 e registros v1 do painel anterior. A importação substitui somente os programas presentes no arquivo.</p></div><div class="panel"><h2>Reiniciar programa</h2><p class="muted">Apaga apenas os registros do programa selecionado, após confirmação.</p><div class="actions"><button class="danger" data-reset="P">Reiniciar ProUni</button><button class="danger" data-reset="S">Reiniciar SISU</button></div></div><div class="panel"><h2>Fontes oficiais</h2><p><a href="${SOURCES.mec}" target="_blank" rel="noopener noreferrer">MEC — documentação ProUni</a> · <a href="${SOURCES.ifb}" target="_blank" rel="noopener noreferrer">IFB — SISU 2026</a></p><p class="muted"><a href="https://ucb2.catolica.edu.br/portal/wp-content/uploads/2026/02/Relacao-de-Documentos-ProUni-2026.1.pdf" target="_blank" rel="noopener noreferrer">Católica — checklist 2026/1</a> · <a href="https://www.iesb.br/content/uploads/2021/07/Documentos-Prouni-2025-Candidatos-2.pdf" target="_blank" rel="noopener noreferrer">IESB — checklist 2025</a>. As exigências definitivas de 2027 ainda estão pendentes. Não armazene documentos reais, CPF, RG, senhas ou credenciais.</p></div>`;}
function render(){document.documentElement.dataset.theme=prefs.theme;document.documentElement.style.setProperty('--accent',color(route.p));const {view,p,g}=route;app.innerHTML=({home,program:()=>program(p),profile:()=>profile(p,g),quota,timeline:()=>timeline(p),settings,income}[view]||home)();}
function modal(title,body,submit,fn){const dlg=$('#dialog');dlg.innerHTML=`<form id="modalform"><h2>${e(title)}</h2>${body}<div class="actions" style="margin-top:18px"><button type="button" id="cancelmodal">Cancelar</button><button class="primary" type="submit">${e(submit)}</button></div></form>`;$('#cancelmodal').onclick=()=>dlg.close();$('#modalform').onsubmit=ev=>{ev.preventDefault();try{fn(new FormData(ev.target));dlg.close();}catch(err){notice(err.message,true);}};dlg.showModal();}
function confirmAction(title,msg,fn){modal(title,`<p>${e(msg)}</p>`,'Confirmar',fn);}
function exportData(which){const out={version:2,exportedAt:new Date().toISOString(),programs:which==='all'?data:{[which]:data[which]},...(which==='all'?{prefs}:{})};const raw=JSON.stringify(out,null,2);try{localStorage.setItem(KEYS.backup,raw);}catch(err){notice('Backup local indisponível; arquivo exportado.',true);}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download=`central-documentos-${which==='all'?'completo':pn(which).toLowerCase()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importData(raw){const out=decodeBackup(JSON.parse(raw));confirmAction('Restaurar backup','Substituir registros dos programas presentes no backup? Exporte os dados atuais primeiro se desejar preservá-los.',()=>{for(const [p,v] of Object.entries(out.programs)){data[p]=v;blocked.delete(p);save(p);}if(out.prefs){prefs=out.prefs;blocked.delete('prefs');save('prefs');}render();if(Object.keys(out.programs).some(p=>{try{return localStorage.getItem(KEYS[p])!==JSON.stringify(data[p]);}catch{return true;}}))notice('Importação carregada, mas parte dos dados não foi salva. Exporte um backup.',true);});}
$('#brand').onclick=()=>go('home');$('#settings').onclick=()=>go('settings');
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const z=b.dataset,p=route.p,g=route.g;if(z.go){go(z.go,z.p||p,z.g===undefined?g:+z.g);return;}if(z.expand){opened.has(z.expand)?opened.delete(z.expand):opened.add(z.expand);render();app.querySelector(`[data-expand="${CSS.escape(z.expand)}"]`)?.focus();}if(z.export)exportData(z.export);if(z.import)$('#importfile').click();if(z.restore){try{const raw=localStorage.getItem(KEYS.backup);if(!raw)throw Error('Nenhum backup local disponível.');importData(raw);}catch(err){notice(err.message,true);}}if(z.reset)confirmAction('Reiniciar '+pn(z.reset),'Todos os registros personalizados deste programa serão removidos. O outro programa não será alterado.',()=>{data[z.reset]=fresh();blocked.delete(z.reset);save(z.reset);render();});if(z.remove)confirmAction('Remover documento','Remover somente deste programa?',()=>{data[p].removed.push(z.remove);save(p);render();});if(z.edit){const d=docs(p).find(x=>x.id===z.edit);modal('Editar documento',`<label class="field">Nome<input name="name" required maxlength="180" value="${e(d.name)}"></label>`,'Salvar',f=>patch(p,d.id,{name:f.get('name').trim()||d.name}));}if(z.add){modal('Adicionar documento',`<div class="formgrid"><label class="field full">Nome<input name="name" required maxlength="180"></label><label class="field">Categoria<select name="cat">${CATS.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select></label><label class="field">Tipo<select name="kind"><option value="C">Condicional</option><option value="O">Obrigatório confirmado</option><option value="P">Complementar</option></select></label><label class="field">Preparação<select name="time">${Object.entries(timing).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>${p==='S'?'<label class="field">Modalidade<select name="mode"><option value="A">Todas</option><option value="E">Escola pública</option><option value="R">Baixa renda</option></select></label>':''}</div>`,'Adicionar',f=>{const name=f.get('name').trim();if(!name)throw Error('Informe o nome.');const id=p+'NOVO'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));data[p].custom.push({id,g,cat:+f.get('cat'),name,mode:p==='P'?'P':f.get('mode'),kind:f.get('kind'),time:f.get('time'),detail:'Documento adicionado manualmente.',link:'',urgent:false,shared:false});save(p);render();});}});
app.addEventListener('change',ev=>{const t=ev.target,z=t.dataset,p=route.p;if(z.check){const d=docs(p).find(x=>x.id===z.check);patch(p,z.check,{status:t.checked?'V':'P',...(t.checked&&d&&d.kind==='C'?{applicable:true}:{})});return;}if(z.status){const d=docs(p).find(x=>x.id===z.status);patch(p,z.status,{status:t.value,...(t.value==='V'&&d&&d.kind==='C'?{applicable:true}:{})});return;}if(z.applicable){patch(p,z.applicable,{applicable:t.checked});return;}if(z.copy){patch(p,z.copy,{copy:t.checked});return;}if(z.stage!==undefined){data[p].timeline[z.stage]=t.checked;save(p);return;}if(t.id==='filter'){filter=t.value;render();$('#filter')?.focus();}if(t.name==='quota'){prefs.quota=t.value;save('prefs');render();}if(t.id==='light'){prefs.theme=t.checked?'light':'dark';save('prefs');render();}});
app.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.note){patch(route.p,t.dataset.note,{note:t.value},false);return;}if(t.id==='search'){query=t.value;const pos=t.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos);}if(t.id==='gross'||t.id==='minimum'){const a=$('#gross').value,b=$('#minimum').value;$('#simulation').textContent=a!==''&&b!==''&&+a>=0&&+b>0?`Renda por pessoa: ${(+a/5).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}. Limites familiares: LB_EP ${(5*+b).toFixed(2)}; ProUni integral ${(7.5*+b).toFixed(2)}; parcial ${(15*+b).toFixed(2)}. Simulação, não decisão oficial.`:'Informe valores válidos.';}});
app.addEventListener('toggle',ev=>{if(ev.target.matches?.('details[data-cat]')&&ev.target.isConnected){const i=+ev.target.dataset.cat;ev.target.open?closedCats.delete(i):closedCats.add(i);}},true);
$('#importfile').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{if(f.size>2e6)throw Error('Arquivo muito grande.');importData(await f.text());}catch(err){notice('Backup rejeitado: '+err.message,true);}};
load();render();

</script></body></html>
